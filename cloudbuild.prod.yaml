# Prod promote of the Orbit MCP servers, the second half of a merge deploy
# (docs/RELEASE_PIPELINE.md). The manual trigger orbit-mcp-prod runs it; the dev
# build of a merge starts it for the same commit after dev verify passed
# (release/release_gate.py request-promote). It builds and deploys nothing: it
# moves 100% of the traffic of each service to the candidate revision that dev
# verify checked (the same revision is the same image).
#
# Guards before the first change:
#   1. single flight: a newer prod build supersedes this one; an older one or a
#      rollback that still runs is waited for;
#   2. the commit must be reachable from main on GitHub;
#   3. the newest dev build of the commit succeeded;
#   4. the gate: dev verify of this commit passed for exactly these revisions
#      and digests, no freeze, no hold after a rollback, no newer verified commit;
#      the build holds the prod lock from here to release-record-finish.
# Then the release record, the traffic move, the deploy check and the watch
# window (+15 and +60 min), which rolls back a failed release on its own.
substitutions:
  # Set by the dev build that started this promote (release_gate.py); empty for manual runs.
  _DEV_BUILD_ID: ""

steps:
  - name: gcr.io/cloud-builders/gcloud
    id: promote-preflight
    entrypoint: bash
    allowExitCodes: [1]
    args:
      - -c
      - |
        echo "Started by dev build: $${PROMOTE_DEV_BUILD_ID:-none (manual run)}"
        python3 release/release_light.py preflight --build-id "$BUILD_ID" --commit "$COMMIT_SHA" --out-dir /workspace
        GUARD_STATUS=$$?
        if [ "$${GUARD_STATUS}" -eq 3 ]; then touch /workspace/deploy_superseded; exit 0; fi
        if [ "$${GUARD_STATUS}" -ne 0 ]; then touch /workspace/promote_blocked; exit 1; fi
    env:
      - PROMOTE_DEV_BUILD_ID=$_DEV_BUILD_ID
    timeout: 5400s

  - name: gcr.io/cloud-builders/gcloud
    id: promote-gate
    entrypoint: bash
    allowExitCodes: [1]
    args:
      - -c
      - |
        if [ -f /workspace/promote_blocked ] || [ -f /workspace/deploy_superseded ]; then exit 0; fi
        python3 release/release_gate.py check-prod \
          --commit "$COMMIT_SHA" \
          --build-id "$BUILD_ID" \
          --artifacts-file /workspace/release_artifacts.json \
          --skip-reason-file /workspace/promote_skip_reason
        GATE_STATUS=$$?
        if [ "$${GATE_STATUS}" -eq 4 ]; then touch /workspace/deploy_superseded; exit 0; fi
        if [ "$${GATE_STATUS}" -ne 0 ]; then touch /workspace/promote_blocked; exit 1; fi

  - name: gcr.io/cloud-builders/gcloud
    id: notify-promote-blocked
    entrypoint: bash
    secretEnv: [WEBHOOK_ORBIT]
    args:
      - -c
      - |
        if [ ! -f /workspace/promote_blocked ]; then exit 0; fi
        # Blocked before any change: the no-change receipt (release_verify.builds_since_rollback).
        if [ -n "$${BUILDER_OUTPUT:-}" ]; then
          printf '%s\n' '{"release_deploy":"skipped_before_mutation"}' > "$${BUILDER_OUTPUT}/output"
        fi
        echo 'orbit-mcp prod promote blocked for commit `$SHORT_SHA` (not on main, dev build missing or failed, dev verify not passed, or the candidate revisions changed); see the promote-preflight and promote-gate steps of <https://console.cloud.google.com/cloud-build/builds;region=us-central1/$BUILD_ID?project=$PROJECT_ID|the prod build>' >&2
        python3 -c 'import sys; sys.path.insert(0, "/workspace/release"); import release_record as rr; rr.post_status(sys.argv[1], sys.argv[2])' "on hold" orbit-mcp || true
        exit 1

  # Still current: right before the traffic moves, no newer prod build exists,
  # no older one or rollback started, and the revisions are as preflight read them.
  - name: gcr.io/cloud-builders/gcloud
    id: promote-still-current
    entrypoint: bash
    allowExitCodes: [1]
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ]; then exit 0; fi
        python3 release/release_light.py still-current --build-id "$BUILD_ID" --commit "$COMMIT_SHA" --out-dir /workspace
        GUARD_STATUS=$$?
        if [ "$${GUARD_STATUS}" -eq 3 ]; then touch /workspace/deploy_superseded; exit 0; fi
        if [ "$${GUARD_STATUS}" -ne 0 ]; then touch /workspace/deploy_failed; exit 1; fi

  # Release record (gs://orbit-search-release-records/orbit-mcp/prod/): the
  # revisions that serve now (the rollback target) and the revisions to promote.
  - name: gcr.io/cloud-builders/gcloud
    id: release-record-begin
    entrypoint: bash
    args:
      - -c
      - |
        # Every path that stops before the promote leaves the no-change receipt, so this build never
        # counts as a prod change (release_verify.builds_since_rollback).
        release_no_change() {
          if [ -n "$${BUILDER_OUTPUT:-}" ]; then
            printf '%s\n' '{"release_deploy":"skipped_before_mutation"}' > "$${BUILDER_OUTPUT}/output"
          fi
        }
        if [ -f /workspace/deploy_failed ] || [ -f /workspace/deploy_superseded ] || [ -f /workspace/promote_blocked ]; then
          release_no_change
          exit 0
        fi
        python3 release/release_light.py begin --env prod --commit "$COMMIT_SHA" --build-id "$BUILD_ID" \
          --artifacts-file /workspace/release_artifacts.json \
          --release-id-file /workspace/release_id \
          || { echo "release record not written; promotion stopped" >&2; release_no_change; exit 1; }

  # The promote: 100% of each service's traffic to its verified candidate revision.
  - name: gcr.io/cloud-builders/gcloud
    id: promote
    entrypoint: bash
    allowExitCodes: [1]
    args:
      - -c
      - |
        if [ -f /workspace/release_record_failed ]; then exit 0; fi
        if [ -f /workspace/deploy_failed ] || [ -f /workspace/deploy_superseded ]; then exit 0; fi
        python3 release/release_light.py apply --artifacts-file /workspace/release_artifacts.json \
          || { touch /workspace/deploy_failed; exit 1; }

  # Release record: snapshot again, set deployed or deploy_failed, point latest.json at it, free the prod lock.
  - name: gcr.io/cloud-builders/gcloud
    id: release-record-finish
    entrypoint: bash
    secretEnv: ["WEBHOOK_ORBIT"]
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ] || [ ! -s /workspace/release_id ]; then exit 0; fi
        STATUS=deployed
        if [ -f /workspace/deploy_failed ]; then STATUS=deploy_failed; fi
        # The deploy changed prod: the kit retries the finish. If it still fails, it posts the
        # recovery commands (finish the record, then the deploy check and the watch window) and the
        # build ends red (release-verify-result); nothing below runs on an unfinished record.
        python3 release/release_light.py finish --env prod --attempts 3 --release-id-file /workspace/release_id --status "$${STATUS}" \
          || { echo "release record not finished after 3 attempts; the release is unchecked until the recovery commands in the alert run" | tee -a /workspace/release_verify_unchecked >&2; touch /workspace/release_record_failed; }

  # Deploy check: each service sends 100% to its promoted revision and both
  # /health answer. Then the watch window (+15 and +60 min): new warning and
  # error lines of both services, each traced to a commit. A failed release rolls
  # back on its own (trigger orbit-mcp-rollback) and prod promotes hold.
  - name: gcr.io/cloud-builders/gcloud
    id: release-verify-deploy
    entrypoint: bash
    secretEnv: [WEBHOOK_ORBIT, RELEASE_PEOPLE_JSON]
    args:
      - -c
      - |
        if [ -f /workspace/release_record_failed ]; then exit 0; fi
        # A failed promote is checked too: its failed verdict starts the rollback.
        if [ -f /workspace/deploy_superseded ]; then exit 0; fi
        if [ ! -s /workspace/release_id ]; then
          echo "release record missing; release is unchecked" | tee -a /workspace/release_verify_unchecked >&2
          exit 0
        fi
        python3 release/release_light.py check --env prod --release-id-file /workspace/release_id \
          --failed-marker /workspace/release_verify_failed \
          --alerted-marker /workspace/release_verify_alerted
        VERIFY_STATUS=$$?
        if [ "$${VERIFY_STATUS}" -ne 0 ] && [ "$${VERIFY_STATUS}" -ne 2 ]; then
          echo "release-verify could not run (exit $${VERIFY_STATUS}); release is unchecked" | tee -a /workspace/release_verify_unchecked >&2
        fi
        python3 release/release_light.py schedule-window --release-id-file /workspace/release_id \
          || echo "schedule-window failed; the +15/+60 checks may be unchecked. Inspect checks.window_build and: gcloud builds list --region=us-central1 --project=orbit-search --filter='substitutions._RELEASE_ID=$$(cat /workspace/release_id) AND tags=orbit-mcp-release-verify' --format='table(id,status,createTime)'. Reuse a running watch or its completed checks. Submit a replacement only if no watch exists, or every matching watch has ended and required checkpoints are still unchecked. From this commit run: python3 release/release_light.py schedule-window --release-id $$(cat /workspace/release_id) --source-dir /tmp/release-verify-src" | tee -a /workspace/release_verify_unchecked >&2
        exit 0

  # One Slack line: promote failed, completed, or skipped (with the gate's reason).
  - name: gcr.io/cloud-builders/gcloud
    id: notify-result
    entrypoint: bash
    secretEnv: [WEBHOOK_ORBIT]
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ]; then
          REASON="a newer prod build owns the release"
          if [ -s /workspace/promote_skip_reason ]; then REASON="$$(head -c 600 /workspace/promote_skip_reason)"; fi
          TEXT=":fast_forward: orbit-mcp prod skipped commit \`$SHORT_SHA\`: $${REASON}"
        elif [ -f /workspace/deploy_failed ]; then
          TEXT=":x: orbit-mcp prod promote failed for commit \`$SHORT_SHA\`; see the promote step"
        elif [ -f /workspace/release_verify_unchecked ]; then
          TEXT=":x: orbit-mcp prod is UNCHECKED for commit \`$SHORT_SHA\`; see the release-verify steps"
        elif [ -f /workspace/release_verify_failed ]; then
          TEXT=":x: orbit-mcp release check FAILED for commit \`$SHORT_SHA\`; see the release record"
        else
          TEXT=":white_check_mark: orbit-mcp prod promote completed for commit \`$SHORT_SHA\`"
        fi
        echo "$${TEXT}"
        # Slack gets a status line only for a moment no other step posts: the promote said deploying,
        # the watch says up, and a check that ended with a failed verdict posted down (release_verify_alerted).
        # The reason stays in this build log.
        STATE=""
        if [ -f /workspace/deploy_superseded ] || [ -f /workspace/release_verify_alerted ]; then :
        elif [ -f /workspace/release_record_failed ] && [ ! -s /workspace/release_id ]; then STATE="warning"  # begin failed: no deploy
        elif [ -f /workspace/deploy_failed ]; then STATE="down"
        elif [ -s /workspace/release_verify_unchecked ]; then STATE="warning"
        fi
        if [ -n "$${STATE}" ]; then
          python3 -c 'import sys; sys.path.insert(0, "/workspace/release"); import release_record as rr; rr.post_status(sys.argv[1], sys.argv[2])' "$${STATE}" orbit-mcp || true
        fi
        if [ -f /workspace/deploy_failed ]; then exit 1; fi

  # A failed release-verify check ends the build red (the record holds the rollback suggestion).
  - name: gcr.io/cloud-builders/gcloud
    id: release-verify-result
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/release_verify_unchecked ]; then
          echo "release UNCHECKED: $$(cat /workspace/release_verify_unchecked)" >&2
          exit 1
        fi
        if [ ! -f /workspace/release_verify_failed ]; then exit 0; fi
        echo "release-verify failed; see the release record and the release-verify-deploy step" >&2
        exit 1

# Up to 60 minutes waiting for an older prod build and 20 for the dev build of this commit.
timeout: 7200s

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/slack-webhook-workspace-orbit/versions/latest
      env: WEBHOOK_ORBIT
    # orbit-mcp is public: the GitHub login -> Slack id map comes from Secret Manager
    # (release/release_people.json is only vendored in private repositories).
    - versionName: projects/$PROJECT_ID/secrets/release-people-json/versions/latest
      env: RELEASE_PEOPLE_JSON
