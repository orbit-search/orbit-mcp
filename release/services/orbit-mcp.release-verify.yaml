# GENERATED by release/release_kit.py render from release/services/orbit-mcp.json. Do not edit.
# Watch window of one orbit-mcp prod release (kind cloud_run, tier full):
# release/release_light.py watch. The prod build submits it with the kit and the
# source tree as its source (release_light.py schedule-window). It reads Cloud
# Logging and GitHub, and writes the release record and Slack
# lines. When the release fails it starts the orbit-mcp-rollback trigger with
# _EXPECT_LATEST and pings the suspected PR's author; test runs (_AUTO_ROLLBACK
# empty) never roll back.
steps:
    - name: "gcr.io/cloud-builders/gcloud"
      id: "release-verify-window"
      entrypoint: "bash"
      args:
          - "-c"
          - |
              set -euo pipefail
              python3 release/release_light.py --service "${_SERVICE}" watch \
                --release-id "${_RELEASE_ID}" \
                --checkpoints "${_CHECKPOINTS}"
      env:
          - "RELEASE_SLACK_DISABLED=${_SLACK_DISABLED}"
          - "RELEASE_AUTO_ROLLBACK=${_AUTO_ROLLBACK}"
      secretEnv: ["WEBHOOK_ORBIT"]
      timeout: "13800s"

substitutions:
    _SERVICE: orbit-mcp
    _RELEASE_ID: latest
    _CHECKPOINTS: "15 60"
    # "1" for test runs: print the Slack lines instead of posting them.
    _SLACK_DISABLED: ""
    # "1" (set by schedule-window for real releases): a failed release rolls back.
    _AUTO_ROLLBACK: ""

tags: ["orbit-mcp-release-verify"]
serviceAccount: "projects/orbit-search/serviceAccounts/cloud-build@orbit-search.iam.gserviceaccount.com"
timeout: "14400s"
options:
    logging: CLOUD_LOGGING_ONLY

availableSecrets:
    secretManager:
        - versionName: projects/$PROJECT_ID/secrets/slack-webhook-workspace-orbit/versions/latest
          env: "WEBHOOK_ORBIT"
