# GENERATED by release/release_kit.py render from release/services/orbit-mcp.json. Do not edit.
# Rollback of orbit-mcp prod (kind cloud_run): release/release_rollback.py apply.
# Started through the manual trigger orbit-mcp-rollback by `release_rollback.py
# run`, or by the watch-window build of a release that failed release-verify
# (with _EXPECT_LATEST set). It builds nothing: the traffic goes back to the target release's revisions.
# It holds the prod lock, writes a release record, and holds automatic prod
# deploys until a revert or a Fixes-release commit merges. _DRY_RUN defaults to
# true, so a run without substitutions changes nothing.
steps:
    - name: "gcr.io/cloud-builders/gcloud"
      id: "rollback"
      entrypoint: "bash"
      args:
          - "-c"
          - |
              set -euo pipefail
              DRY_RUN_FLAG=""
              if [ "$${ROLLBACK_DRY_RUN}" != "false" ]; then DRY_RUN_FLAG="--dry-run"; fi
              python3 release/release_rollback.py apply \
                --service orbit-mcp \
                --target "$${ROLLBACK_TARGET}" \
                --reason "$${ROLLBACK_REASON}" \
                --requested-by "$${ROLLBACK_REQUESTED_BY}" \
                --build-id "$BUILD_ID" \
                --expect-latest "$${ROLLBACK_EXPECT_LATEST}" \
                $${DRY_RUN_FLAG}
      env:
          # Free text goes through the environment, never into the script text.
          - "ROLLBACK_TARGET=${_TARGET}"
          - "ROLLBACK_REASON=${_REASON}"
          - "ROLLBACK_REQUESTED_BY=${_REQUESTED_BY}"
          - "ROLLBACK_DRY_RUN=${_DRY_RUN}"
          - "ROLLBACK_EXPECT_LATEST=${_EXPECT_LATEST}"
      secretEnv: ["WEBHOOK_ORBIT"]
      # Up to 30 min for the prod lock (release_rollback.py LOCK_WAIT_SECONDS), then the apply.
      timeout: "3600s"

substitutions:
    _TARGET: previous
    _REASON: ""
    _REQUESTED_BY: ""
    _DRY_RUN: "true"
    # A release id: refuse unless it is still the newest record (automatic rollbacks).
    _EXPECT_LATEST: ""

# The prod builds and release_light.py find running rollbacks by this tag.
tags: ["orbit-mcp-rollback"]
serviceAccount: "projects/orbit-search/serviceAccounts/cloud-build@orbit-search.iam.gserviceaccount.com"
timeout: "3900s"
options:
    logging: CLOUD_LOGGING_ONLY

availableSecrets:
    secretManager:
        - versionName: projects/$PROJECT_ID/secrets/slack-webhook-workspace-orbit/versions/latest
          env: "WEBHOOK_ORBIT"
