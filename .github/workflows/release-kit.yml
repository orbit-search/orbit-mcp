# Release kit check: release/ is a pinned copy of orbit-infrastructure/release-kit
# (docs/RELEASE_PIPELINE.md). The Cloud Build kubectl and gcloud images run Python 3.10.
name: Release Kit

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python release/release_kit.py check
      - run: python -m unittest discover -s release -p 'test_*.py'
