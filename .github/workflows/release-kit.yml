# Release kit check: release/ is a pinned copy of orbit-infrastructure/release-kit
# (docs/RELEASE_PIPELINE.md). The Cloud Build kubectl and gcloud images run Python 3.10.
name: Release Kit

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python release/release_kit.py check
      # Offline: KUBECONFIG=/dev/null, an empty CLOUDSDK_CONFIG, GOOGLE_APPLICATION_CREDENTIALS=/dev/null
      # and blocked live CLIs (release/run_offline_checks.py), so a missed mock reaches nothing.
      - run: python release/run_offline_checks.py -- python -m unittest discover -s release -p 'test_*.py'
