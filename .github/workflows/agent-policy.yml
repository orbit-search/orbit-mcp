# Sets the agent-policy commit status on each PR head: which changes need a
# human approval record, and whether the PR has it. Runs the default branch's
# checker, reads each PR's policy from its target branch, and never executes
# pull request code.
name: agent-policy

on:
  pull_request_target:
    # closed: a PR that leaves a shared head rechecks the PRs still on it.
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  # One status covers every PR that shares a head commit, so group by head when the event has it.
  group: agent-policy-${{ github.event.pull_request.head.sha || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - name: Evaluate the agent policy
        run: python3 .github/scripts/agent_policy_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
