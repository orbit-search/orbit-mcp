# Sets the agent-policy commit status on each PR head: which changes need a
# human approval record, and whether the PR has it. Runs the default branch's
# checker, reads each PR's policy from its target branch, and never executes
# pull request code.
name: agent-policy

on:
  pull_request_target:
    # closed: a PR that leaves a shared head rechecks the PRs still on it.
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  # A new policy or checker on the default branch rechecks every open PR.
  push:
    paths:
      - ".github/agent-policy.json"
      - ".github/scripts/agent_policy_check.py"
      - ".github/workflows/agent-policy.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  # One queue per PR (PR events and comments share it): a newer run cancels an
  # older one, so an older result can never overwrite a newer one.
  group: agent-policy-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - name: Evaluate the agent policy
        run: python3 .github/scripts/agent_policy_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
