# Merges a ready pull request as orbit-harness[bot], so no agent waits for a
# human to say "merge". Runs .github/scripts/agent_merge.py from the default
# branch and never runs pull request code; the App key is used only by events
# that run the default branch's copy of this file. It squash-merges only the head
# commit it checked, when the PR is open and not a draft, has no `hold` label,
# agent-policy passes, every check passes, Greptile reviewed the head and no
# review thread is open. It never updates a branch that is behind: the human's
# login does that. orbit-infrastructure's agent-merge-sweep.yml checks every
# repo every 15 minutes as a backstop (for thread resolution and approval
# records, which start no workflow here).
name: agent-merge

on:
  pull_request_target:
    types: [ready_for_review, labeled, unlabeled, synchronize]
  pull_request_review:
    types: [submitted]
  # Other apps' checks (Greptile, ...). GitHub starts no workflow for check
  # suites that GitHub Actions created, so Actions CI arrives as workflow_run.
  check_suite:
    types: [completed]
  status:
  workflow_run:
    # The workflows that run on pull_request in this repo.
    workflows: ["Release Kit", "Test", "agent-policy-tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (empty = every open PR)
        required: false

permissions:
  contents: read

concurrency:
  # One queue per PR: a newer event waits for the running check, never cancels a merge.
  group: agent-merge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.event.sha || github.event.check_suite.head_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  # A review event runs this file from the PR's merge ref, so this job holds no
  # key: it starts the merge job on the default branch for that PR.
  relay-review:
    if: >-
      vars.ORBIT_AGENT_CLIENT_ID != '' &&
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Start agent-merge on the default branch
        run: gh workflow run agent-merge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pr="$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}

  merge:
    name: agent-merge
    # Every event here runs the default branch's copy of this file. Skip events
    # that cannot make a PR ready. No client id = the org secret and variable
    # are not set yet.
    if: >-
      vars.ORBIT_AGENT_CLIENT_ID != '' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'check_suite' && contains(fromJSON('["success","neutral","skipped"]'), github.event.check_suite.conclusion)) ||
      (github.event_name == 'status' && github.event.state == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","neutral","skipped"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mint an orbit-harness token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ORBIT_AGENT_CLIENT_ID }}
          private-key: ${{ secrets.ORBIT_AGENT_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          # A merge that changes workflow files needs it.
          permission-workflows: write
      - name: Merge ready pull requests
        run: python3 .github/scripts/agent_merge.py
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
