# Deploy of the Orbit MCP servers (Cloud Run orbit-mcp and orbit-profile-mcp;
# docs/RELEASE_PIPELINE.md). The push trigger orbit-mcp-deploy runs it for every
# merge to main. Release kit tier check_only: single flight (a newer merge's build
# supersedes an older one; the commit must be on main), a release record, each
# image built once and deployed by digest, a deploy check (the new revisions are
# ready and serve all traffic; both /health answer), and a watch window at +15 and
# +60 min. A failed release alerts the suspected PR's author with the rollback
# command (traffic back to the previous revisions).
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/gcloud
    id: turn
    entrypoint: bash
    args:
      - -c
      - |
        python3 release/release_light.py turn --build-id "$BUILD_ID" --commit "$COMMIT_SHA"
        TURN_STATUS=$$?
        if [ "$${TURN_STATUS}" -eq 3 ]; then touch /workspace/deploy_superseded; exit 0; fi
        exit "$${TURN_STATUS}"
    timeout: 2000s

  # Build and push both images by commit, and write their pushed digests.
  - name: gcr.io/cloud-builders/docker
    id: build-images
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -f /workspace/deploy_superseded ]; then exit 0; fi
        for pair in "orbit-mcp:packages/mcp-server" "orbit-profile-mcp:packages/profile-server"; do
          NAME="$${pair%%:*}"; DIR="$${pair#*:}"
          REPO="gcr.io/$PROJECT_ID/$${NAME}"
          docker build -f "$${DIR}/Dockerfile" -t "$${REPO}:$COMMIT_SHA" -t "$${REPO}:latest" "$${DIR}"
          docker push "$${REPO}:$COMMIT_SHA"
          docker push "$${REPO}:latest"
          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$${REPO}:$COMMIT_SHA" | grep -F "$${REPO}@" | head -1 | grep -o 'sha256:[0-9a-f]\{64\}')"
          test -n "$${DIGEST}"
          printf '%s\n' "$${REPO}@$${DIGEST}" > "/workspace/$${NAME}.image"
          echo "Pushed $${REPO}@$${DIGEST}"
        done

  # Release record: the serving revision of each service before the deploy (the rollback target).
  - name: gcr.io/cloud-builders/gcloud
    id: release-record-begin
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ]; then exit 0; fi
        python3 release/release_light.py begin --commit "$COMMIT_SHA" --build-id "$BUILD_ID" \
          --release-id-file /workspace/release_id \
          || { echo "WARNING: release record not written; the deploy continues without one" >&2; rm -f /workspace/release_id; }

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    allowExitCodes: [1]
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ]; then exit 0; fi
        gcloud run deploy orbit-mcp --image "$(cat /workspace/orbit-mcp.image)" --region us-central1 \
          --platform managed --allow-unauthenticated --remove-env-vars MCP_BYPASS_KEY \
          || { touch /workspace/deploy_failed; exit 1; }
        gcloud run deploy orbit-profile-mcp --image "$(cat /workspace/orbit-profile-mcp.image)" --region us-central1 \
          --platform managed --allow-unauthenticated \
          || { touch /workspace/deploy_failed; exit 1; }

  - name: gcr.io/cloud-builders/gcloud
    id: release-record-finish
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ] || [ ! -s /workspace/release_id ]; then exit 0; fi
        STATUS=deployed
        if [ -f /workspace/deploy_failed ]; then STATUS=deploy_failed; fi
        python3 release/release_light.py finish --release-id-file /workspace/release_id --status "$${STATUS}" \
          || echo "WARNING: release record not finished" >&2

  # Deploy check, then the watch window: new warning and error lines of both
  # services, each traced to a commit. A failed deploy is checked too.
  - name: gcr.io/cloud-builders/gcloud
    id: release-verify-deploy
    entrypoint: bash
    secretEnv: [WEBHOOK_ORBIT]
    args:
      - -c
      - |
        if [ -f /workspace/deploy_superseded ] || [ ! -s /workspace/release_id ]; then exit 0; fi
        python3 release/release_light.py check --release-id-file /workspace/release_id \
          --failed-marker /workspace/release_verify_failed
        VERIFY_STATUS=$$?
        if [ "$${VERIFY_STATUS}" -ne 0 ] && [ "$${VERIFY_STATUS}" -ne 2 ]; then
          echo "WARNING: release-verify could not run (exit $${VERIFY_STATUS})" >&2
        fi
        python3 release/release_light.py schedule-window --release-id-file /workspace/release_id \
          || echo "WARNING: the watch-window build was not submitted" >&2
        exit 0

  - name: gcr.io/cloud-builders/gcloud
    id: result
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/deploy_failed ]; then echo "a Cloud Run deploy failed; see the deploy step" >&2; exit 1; fi
        if [ -f /workspace/release_verify_failed ]; then echo "release-verify failed; see the release record" >&2; exit 1; fi

timeout: 3600s

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/slack-webhook-workspace-orbit/versions/latest
      env: WEBHOOK_ORBIT
